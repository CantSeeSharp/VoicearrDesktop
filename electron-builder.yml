appId: com.voicearr.desktop
productName: Voicearr
copyright: Voicearr

directories:
  output: release/

publish:
  provider: generic
  url: https://updates.cantseesharp.com

# Files included inside the asar
files:
  - dist/**
  - package.json

# Copied outside the asar so the OS can read them directly (tray icon, etc.)
# Add icon.png (256x256) to resources/ before building
extraResources:
  - from: resources/
    to: resources/
    filter: "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-Setup-beta.${ext}"
  # icon: resources/icon.ico   # Uncomment after adding icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  artifactName: "${productName}-beta.${ext}"
  category: Network
  # icon: resources/icon.png   # Uncomment after adding icon.png

mac:
  target:
    - dmg
  artifactName: "${productName}-beta.${ext}"
  # icon: resources/icon.icns  # Uncomment after adding icon.icns
