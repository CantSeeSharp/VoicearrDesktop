appId: com.voicearr.desktop
productName: Voicearr
copyright: Voicearr

directories:
  output: release/

publish:
  provider: github
  owner: CantSeeSharp
  repo: VoicearrDesktop
  tagPrefix: ""
  # Releases tagged v1.0.0-beta.1 (with pre-release segment) are automatically
  # marked as pre-release on GitHub. Stable tags like v1.0.0 produce stable releases.
  # The app reads the GitHub release API at startup to pick the correct server URL.

# Files included inside the asar
files:
  - dist/**
  - package.json

# Copied outside the asar so the OS can read them directly (tray icon, etc.)
# Add icon.png (256x256) to resources/ before building
extraResources:
  - from: resources/
    to: resources/
    filter: "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  # icon: resources/icon.ico   # Uncomment after adding icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Network
  # icon: resources/icon.png   # Uncomment after adding icon.png

mac:
  target:
    - dmg
  # icon: resources/icon.icns  # Uncomment after adding icon.icns
