name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_args: --linux
          - os: windows-latest
            platform_args: --win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Decide GitHub release type
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$VERSION" == *"-beta"* ]]; then
            echo "EP_PRE_RELEASE=true" >> $GITHUB_ENV
            echo "Release will be published as a prerelease"
          else
            echo "Release will be published as a full release"
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libx11-dev libxtst-dev libxinerama-dev libxrandr-dev

      - run: npm ci
      - run: npm run rebuild
      - run: npx tsc

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.platform_args }} --publish always